<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Esmeralda</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        #loading p {
            margin: 8px 0;
            font-size: 16px;
        }
        #loading small {
            opacity: 0.7;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <p>Cargando emulador...</p>
        <p><small>En móvil puede tardar 15-40 segundos la primera vez</small></p>
        <p><small>No cierres la pestaña</small></p>
    </div>

    <div id="game-container"></div>

    <script>
        EJS_player = '#game-container';
        EJS_core = 'gba';                          // gb = Game Boy / GBC  |  gba = Game Boy Advance
        EJS_gameUrl = 'pokemon-esmeralda.gba';      // ← cambia solo esto
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_color = '#000000';

        window.EJS_ready = function () {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
